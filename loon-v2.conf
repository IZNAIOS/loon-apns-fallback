# group as a manual fallback. APNs already matched its own independent policy.
GEOIP,CN,DIRECT
FINAL,PROXY

[Remote Rule]
# Local rules above take precedence. ChinaMax is evaluated before Global to
# reduce overlap; the unmatched final policy is PROXY.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMax/ChinaMax.list,policy=DIRECT,tag=ChinaMax,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Global/Global.list,policy=PROXY,tag=Global,enabled=true

[Host]

[Rewrite]
# Intentionally empty. Keep ad-block and service modules in separate plugins.

[Script]
# Intentionally empty. Keep third-party scripts in separate plugins.

[Plugin]
# The plugin's internal PROXY policy is mapped directly to APNS-FALLBACK.
https://raw.githubusercontent.com/IZNAIOS/loon-apns-fallback/main/apns-push-fallback.plugin,tag=APNs-Push-Fallback,proxy=APNS-FALLBACK,enable=true

[Mitm]
